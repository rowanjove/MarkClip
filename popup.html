<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页摘</title>
  <style>
    :root {
      --bg: #202522;
      --surface: #292f2b;
      --surface-raised: #303833;
      --surface-soft: #252b27;
      --border: #424b45;
      --text: #f4f6f2;
      --text-muted: #aeb8b0;
      --text-subtle: #87938a;
      --accent: #a9ddb4;
      --accent-strong: #6fba84;
      --accent-ink: #17341f;
      --error: #ffb4a9;
      --error-bg: #482c2a;
      --focus: #d7f2dc;
    }

    body.light {
      --bg: #f6f7f3;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-soft: #eef2ed;
      --border: #d4ddd5;
      --text: #1e2721;
      --text-muted: #58675d;
      --text-subtle: #718077;
      --accent: #24623d;
      --accent-strong: #24623d;
      --accent-ink: #ffffff;
      --error: #a5312c;
      --error-bg: #fce8e5;
      --focus: #1e6d3b;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 240px;
      max-height: 600px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-mark {
      width: 26px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .brand-mark img { display: block; width: 26px; height: 30px; object-fit: contain; }
    h1 { margin: 0; font-size: 16px; font-weight: 720; letter-spacing: .01em; line-height: 1.15; }
    .subtitle { margin-top: 2px; color: var(--text-muted); font-size: 11px; }

    .icon-btn, .btn-ghost {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .icon-btn { width: 32px; height: 32px; border-radius: 6px; font-size: 14px; }
    .icon-btn:hover, .btn-ghost:hover { background: var(--surface-soft); color: var(--text); }

    .content {
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px 12px;
      scrollbar-color: var(--border) transparent;
    }

    .context { margin-bottom: 14px; }
    .eyebrow { color: var(--text-subtle); font-size: 11px; letter-spacing: .04em; }
    .page-title {
      margin-top: 3px;
      overflow: hidden;
      color: var(--text);
      font-size: 15px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-line { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .status-dot { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--accent-strong); }
    .status-dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .35; } }

    .section { margin-bottom: 14px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .section-heading h2 { margin: 0; font-size: 12px; font-weight: 700; }
    .section-heading span { color: var(--text-subtle); font-size: 11px; }

    .mode-toggle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-soft); }
    .mode-btn { min-height: 34px; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 650; }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active { background: var(--surface-raised); color: var(--text); box-shadow: 0 0 0 1px var(--accent-strong); }

    .option-list { border-top: 1px solid var(--border); }
    .option-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--border); }
    .option-copy { min-width: 0; color: var(--text); }
    .option-copy small { display: block; margin-top: 1px; color: var(--text-muted); font-size: 11px; }

    .switch { width: 38px; height: 22px; flex: 0 0 auto; position: relative; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-soft); cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-subtle); transition: transform .16s ease, background .16s ease; }
    .switch.on { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent-strong) 18%, transparent); }
    .switch.on::after { transform: translateX(16px); background: var(--accent-strong); }

    .error-msg { display: none; margin: 0 0 12px; padding: 9px 10px; border: 1px solid color-mix(in srgb, var(--error) 55%, transparent); border-radius: 6px; background: var(--error-bg); color: var(--error); font-size: 12px; }
    .error-msg.visible { display: block; }

    .result-meta { display: none; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--text-muted); font-size: 11px; }
    .result-meta.visible { display: flex; }
    .result-meta strong { color: var(--text); font-weight: 650; }

    .preview-box { display: none; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); overflow: hidden; }
    .preview-box.visible { display: block; }
    .preview-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 11px; }
    .preview-header span { flex: 0 0 auto; }
    .preview-title { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); text-align: right; text-overflow: ellipsis; }
    .preview-title:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
    .preview-content { display: block; width: 100%; min-height: 110px; max-height: 240px; resize: vertical; overflow: auto; padding: 10px; border: 0; outline: 0; background: transparent; color: var(--text); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .preview-content:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

    .more-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .advanced-actions { margin: 0 0 2px; }
    .advanced-actions summary { display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 7px 0; border-top: 1px solid var(--border); color: var(--text-muted); cursor: pointer; font-size: 11px; list-style: none; }
    .advanced-actions summary::-webkit-details-marker { display: none; }
    .advanced-actions summary::after { content: '+'; color: var(--text-subtle); font-size: 16px; line-height: 1; }
    .advanced-actions[open] summary::after { content: '−'; }
    .more-actions { padding: 2px 0 5px; }
    .more-actions button { min-height: 32px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; }
    .more-actions button:hover { color: var(--text); }

    .action-bar { display: grid; grid-template-columns: 1.35fr 1fr 38px; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); background: var(--bg); }
    .btn { min-height: 38px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; }
    .btn-primary { border-color: var(--accent-strong); background: var(--accent-strong); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: var(--surface-soft); color: var(--text); }
    .btn-secondary:hover { background: var(--surface-raised); }
    .btn-ghost { width: 38px; padding: 0; }
    .btn.loading { opacity: .6; pointer-events: none; }
    button:disabled { cursor: wait; opacity: .55; }

    .cancel-btn { border: 0; background: transparent; color: var(--error); cursor: pointer; font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: 66px; z-index: 2; max-width: calc(100% - 32px); padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-raised); color: var(--text); font-size: 11px; opacity: 0; pointer-events: none; transform: translate(-50%, 6px); transition: opacity .16s ease, transform .16s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="light" aria-busy="false">
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="icons/icon48.png" alt="" /></span>
      <div>
        <h1>页摘</h1>
        <div class="subtitle">网页摘录为 Markdown</div>
      </div>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">◐</button>
  </header>

  <main class="content">
    <section class="context" aria-labelledby="contextHeading">
      <div class="eyebrow" id="contextHeading">当前页面</div>
      <div class="page-title" id="pageTitle">主内容</div>
      <div class="status-line" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="statusText">准备提取正文</span><button class="cancel-btn" id="btnCancel" type="button" hidden>取消</button></div>
    </section>

    <section class="section" aria-labelledby="modeHeading">
      <div class="section-heading"><h2 id="modeHeading">提取范围</h2><span>选择要保存的部分</span></div>
      <div class="mode-toggle" aria-label="提取范围">
        <button class="mode-btn active" data-mode="main" type="button" aria-pressed="true">正文</button>
        <button class="mode-btn" data-mode="pick" type="button" aria-pressed="false">选择区域</button>
        <button class="mode-btn" data-mode="full" type="button" aria-pressed="false">整页</button>
      </div>
    </section>

    <section class="section" aria-labelledby="optionsHeading">
      <div class="section-heading"><h2 id="optionsHeading">图片处理</h2><span>默认保留链接</span></div>
      <div class="option-list">
        <div class="option-row">
          <div class="option-copy">移除图片链接<small>只保留文字和结构</small></div>
          <button class="switch" id="removeImagesSwitch" type="button" role="switch" aria-checked="false" aria-label="移除图片链接"></button>
        </div>
        <div class="option-row">
          <div class="option-copy">内嵌图片<small>将可访问图片保存为本地数据</small></div>
          <button class="switch" id="localizeImagesSwitch" type="button" role="switch" aria-checked="false" aria-label="内嵌图片"></button>
        </div>
        <div class="option-row">
          <div class="option-copy">页面快捷入口<small>在普通网页边缘显示小图标</small></div>
          <button class="switch" id="floatingSwitch" type="button" role="switch" aria-checked="false" aria-label="页面快捷入口"></button>
        </div>
      </div>
    </section>

    <div class="error-msg" id="errorMsg" role="alert"></div>

    <div class="result-meta" id="stats" aria-live="polite">
      <strong id="statChars">-</strong><span>字符</span><span aria-hidden="true">·</span><strong id="statLines">-</strong><span>行</span><span aria-hidden="true">·</span><strong id="statWords">-</strong><span>估算词数</span>
    </div>

    <section class="preview-box" id="previewBox" aria-labelledby="previewHeading">
      <div class="preview-header"><span id="previewHeading">预览</span><input id="previewTitle" aria-label="Markdown 文件标题" /></div>
      <textarea class="preview-content" id="previewContent" aria-label="Markdown 预览"></textarea>
    </section>

    <details class="advanced-actions" id="advancedActions">
      <summary>更多操作</summary>
      <div class="more-actions" aria-label="更多导出">
        <button id="btnObsidian" type="button">发送到 Obsidian</button>
        <button id="btnBatch" type="button">批量保存</button>
      </div>
    </details>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="action-bar">
    <button class="btn btn-primary" id="btnCopy" type="button">复制 Markdown</button>
    <button class="btn btn-secondary" id="btnDownload" type="button">保存 .md</button>
    <button class="btn btn-ghost" id="btnConvert" type="button" title="重新提取" aria-label="重新提取"><span id="convertIcon">↻</span></button>
  </footer>

  <script src="page2md-core.js"></script>
  <script src="obsidian-utils.js"></script>
  <script src="extension-utils.js"></script>
  <script src="popup-state-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
