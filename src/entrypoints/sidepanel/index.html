<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页摘侧栏</title><link rel="stylesheet" href="./index.css"></head><body><header><strong>页摘工作区</strong><button id="refresh">重新提取</button></header><nav><button class="active" data-tab="preview" aria-selected="true">Preview</button><button data-tab="highlights" aria-selected="false">Highlights</button><button data-tab="assets" aria-selected="false">Assets</button><button data-tab="diagnostics" aria-selected="false">Diagnostics</button><button data-tab="batch" aria-selected="false">Batch</button></nav><main><section id="preview" class="tab active"><input id="title" placeholder="标题"><textarea id="markdown" aria-label="Markdown 编辑器"></textarea><div><button id="copy">复制</button><button id="save">保存</button><button id="saveZip">ZIP 归档</button></div><div><select id="aiOperation"><option value="summary">AI 摘要</option><option value="tags">AI 标签</option><option value="keywords">AI 关键词</option><option value="entities">AI 实体</option><option value="translation">AI 翻译</option><option value="qa">AI 问答</option></select><button id="runAi">运行 AI 后处理</button></div></section><section id="highlights" class="tab"><p>在网页上使用“开始摘录”添加多段高亮。</p><button id="startHighlights">开始摘录</button><button id="refreshHighlights">刷新摘录</button><ol id="highlightList"></ol></section><section id="assets" class="tab"><p id="assetStatus">暂无资源</p><ul id="assetList"></ul></section><section id="diagnostics" class="tab"><pre id="diagnosticData">暂无诊断</pre><button id="copyDiagnostics">复制诊断</button></section><section id="batch" class="tab"><p>批量任务队列</p><label>Profile<select id="batchProfile"><option value="smart">智能 Markdown（GFM）</option><option value="commonmark">CommonMark</option><option value="obsidian">Obsidian</option><option value="archive">完整归档</option></select></label><label><input id="batchAssets" type="checkbox"> 保存图片资源</label><label><input id="batchSnapshot" type="checkbox"> 包含原始快照</label><div><button id="batchStart">当前窗口</button><button id="batchPause">暂停</button><button id="batchResume">继续</button><button id="batchCancel">取消</button><button id="batchRetry">重试失败</button></div><ul id="batchList"></ul></section></main><script type="module" src="./index.ts"></script></body></html>
