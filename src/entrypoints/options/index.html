<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页摘设置</title><style>body{font:14px system-ui,sans-serif;max-width:840px;margin:0 auto;padding:24px;background:#fbfaf6;color:#183526}section{background:#fff;border:1px solid #d8dfd5;border-radius:8px;padding:16px;margin:12px 0}label{display:block;margin:10px 0}button,input,textarea,select{padding:8px;border:1px solid #c8d2c6;border-radius:5px}input,select{max-width:100%;width:100%}textarea{width:100%;min-height:120px;font-family:monospace}#message{color:#2f6942;white-space:pre-wrap}[data-theme="dark"] body{background:#1b231d;color:#edf3ed}[data-theme="dark"] section{background:#263328;border-color:#4a5d4c}[data-theme="dark"] button,[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:#263328;color:#edf3ed;border-color:#4a5d4c}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#1b231d;color:#edf3ed}:root:not([data-theme="light"]) section{background:#263328;border-color:#4a5d4c}:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) textarea,:root:not([data-theme="light"]) select{background:#263328;color:#edf3ed;border-color:#4a5d4c}}</style></head>
<body><h1>页摘设置</h1><p>高级能力集中在这里，Popup 保持轻量。</p>
<section><h2>外观与行为</h2><label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>正文识别 <select id="extractor"><option value="smart">智能</option><option value="defuddle">Defuddle</option><option value="readability">Readability</option><option value="semantic">语义节点</option></select></label><label>浮窗权限 <select id="floating"><option value="page">仅点击扩展时生效</option><option value="site">指定站点始终显示</option><option value="all">所有普通网站显示</option></select></label><label>站点来源（选择“指定站点”时填写，例如 https://example.com）<input id="siteOrigin" type="url" placeholder="https://example.com"></label><button id="save">保存设置</button><span id="message"></span></section>
<section><h2>Recipes</h2><p>支持 JSON/YAML 导入导出；导入内容会经过 schema、CSS selector、host/path 和脚本字段校验。</p><textarea id="recipes" placeholder='JSON Recipe 数组或 YAML 文档'></textarea><input id="recipeFile" type="file" accept=".json,.yaml,.yml,application/json,text/yaml"><button id="importRecipes">导入文件</button><button id="validate">验证并保存</button><button id="exportRecipes">导出 JSON</button><button id="exportRecipesYaml">导出 YAML</button></section>
<section><h2>Template 2.0</h2><p>模板只允许安全变量、filter、条件和循环，不执行 JavaScript。</p><label>ID <input id="templateId" placeholder="article-note"></label><label>名称 <input id="templateName" placeholder="Article note"></label><textarea id="templateBody" placeholder="{{ title }}\n\n{{ content }}"></textarea><button id="saveTemplate">保存模板</button><button id="previewTemplate">预览</button></section>
<section><h2>Profiles</h2><p>Profile 是提取、渲染、图片与导出目标的安全预设。</p><textarea id="profiles" placeholder='JSON/YAML Profile 数组'></textarea><button id="validateProfiles">验证并保存 Profile</button></section>
<section><h2>可选 AI 后处理</h2><label><input id="aiEnabled" type="checkbox"> 启用 AI（默认关闭）</label><label>Provider <select id="aiProvider"><option value="ollama">本地 Ollama</option><option value="openai-compatible">OpenAI-compatible</option></select></label><label>Endpoint <input id="aiEndpoint" type="url" placeholder="http://127.0.0.1:11434"></label><label>Model <input id="aiModel" placeholder="llama3.2"></label><label>API Key（仅 OpenAI-compatible，留空表示不变更）<input id="aiKey" type="password" autocomplete="off"></label><label><input id="rememberAi" type="checkbox"> 记住 API Key（关闭则不保存，需要再次输入）</label><button id="saveAi">保存 AI 设置</button></section>
<section><h2>隐私</h2><p>核心转换、Recipe、模板和 ZIP 都在本地完成。AI 默认关闭；开启后只发送到你配置的服务。</p></section>
<script type="module" src="./index.ts"></script></body></html>
