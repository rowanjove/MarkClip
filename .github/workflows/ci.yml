name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:full
      - run: npm run package:modern
      - run: npm run check:modern-manifest
      - run: npx playwright install chromium
      - run: xvfb-run -a env RUN_BROWSER_E2E=1 npm run test:e2e
      - run: xvfb-run -a npm run test:e2e:modern
